name: Pipeline données sinistres

on:
  schedule:
    - cron: "0 5 * * 1"        # chaque lundi à 5h UTC
  workflow_dispatch:            # lancement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths: ["src/**", "config/**", "data/raw/manuel/**"]

concurrency:
  group: ecriture-donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collecte-et-nettoyage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Collecte (télécharge les sources, détecte les nouvelles versions)
        id: collecte
        run: python -m src.collecte

      # Le nettoyage est relancé si une source a changé, ou si le code a été modifié / lancement manuel
      - name: Nettoyage et fusion
        if: steps.collecte.outputs.nouveautes == 'true' || github.event_name != 'schedule'
        run: python -m src.nettoyage

      - name: Enregistrer les données mises à jour dans le dépôt
        run: |
          git config user.name "pipeline-donnees"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
          else
            git commit -m "Données : mise à jour automatique $(date -u +'%Y-%m-%d')"
            git push
          fi
