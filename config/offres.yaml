# Offres d'assurance auto et moto publiées en Europe (objectif 1).
#
# Source : le document d'information normalisé (IPID) que chaque assureur européen doit publier
# pour chaque produit (directive européenne sur la distribution d'assurances, règlement 2017/1469).
# Même plan dans tous les pays : ce qui est assuré, pas assuré, restrictions, zone, obligations, paiement, durée, résiliation.
#
# Pour ajouter une offre : ajouter une ligne ci-dessous (url = lien direct vers le PDF), puis pousser.
# L'identifiant (id) est facultatif. La collecte se relance toute seule.
# Seuls les documents qui ont bien le plan IPID et parlent d'un véhicule sont gardés (les autres sont écartés).

# Pages d'assureurs qui listent leurs documents : le robot y cherche tout seul les PDF auto et moto.
pages_a_explorer:
  - {url: "https://www.pv.be/fr/ipid", pays: Belgique, assureur: P&V, langue: fr}
  - {url: "https://www.vivium.be/fr/private-individuals/ipid", pays: Belgique, assureur: Vivium, langue: fr}
  - {url: "https://www.april-moto.com/documents-utiles/", pays: France, assureur: APRIL Moto, langue: fr}
  - {url: "https://www.creditmutuel.fr/fr/guides-et-informations-reglementaires/IPID.html", pays: France, assureur: Crédit Mutuel, langue: fr}
  - {url: "https://www.cic.fr/fr/informations-legales/IPID.html", pays: France, assureur: CIC, langue: fr}
  - {url: "https://www.mapfre.pt/seguros/particulares/documentos-informativos/", pays: Portugal, assureur: Mapfre, langue: pt}


